name: native asset-tools
# tools/asset: the character asset toolchain (sculpt strokes to extracted, retopologised, baked and painted
# meshes). Node standard library only; the tests carry their own controls (see tools/asset/DESIGN.md).
on:
  pull_request:
    paths:
      - 'native/tools/asset/**'
      - '.github/workflows/native-asset-tools.yml'
  push:
    branches: [main]
    paths:
      - 'native/tools/asset/**'
permissions:
  contents: read
defaults:
  run:
    working-directory: native

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test tools/asset/test/asset.test.mjs
