name: release-binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag to attach assets to (dry-run artifact upload if omitted)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-bundles:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: windows-x64
            archive_ext: zip
          - os: ubuntu-24.04
            triple: linux-x64
            archive_ext: tar.gz
          - os: macos-latest
            triple: macos-arm64
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -SelfTest
      - name: Self-test installer (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: sh install.sh --self-test
      - name: Build native renderer CLI (raw_native_cli)
        shell: bash
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build --config Release --target raw_native_cli
      - name: Stage Playground engine bundle
        shell: bash
        run: |
          STAGE="dist/stage-${{ matrix.triple }}"
          mkdir -p "$STAGE/native/bin"
          cp package.json README.md "$STAGE/"
          cp -R superframe creation typeengine packages "$STAGE/"
          if [ -f native/build/Release/raw_native_cli.exe ]; then
            cp native/build/Release/raw_native_cli.exe "$STAGE/native/bin/"
          elif [ -f native/build/raw_native_cli ]; then
            cp native/build/raw_native_cli "$STAGE/native/bin/"
          fi
          mkdir -p dist/out
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            python -c "import shutil; shutil.make_archive('dist/out/superframe-playground-${{ matrix.triple }}', 'zip', '$STAGE')"
          else
            tar -czf "dist/out/superframe-playground-${{ matrix.triple }}.tar.gz" -C "$STAGE" .
          fi
      - name: Upload per-platform bundle
        uses: actions/upload-artifact@v4
        with:
          name: superframe-bundle-${{ matrix.triple }}
          path: dist/out/*

  publish-release:
    needs: build-bundles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: superframe-bundle-*
          path: dist/release
          merge-multiple: true
      - name: Generate SHA256SUMS and smoke-test Linux bundle
        run: |
          cp install.ps1 install.sh dist/release/
          (cd dist/release && sha256sum superframe-playground-* install.ps1 install.sh > SHA256SUMS)
          cat dist/release/SHA256SUMS
          sh install.sh --from-dir dist/release --install-dir "$RUNNER_TEMP/sf-smoke" --no-path
          test -x "$RUNNER_TEMP/sf-smoke/bin/superframe"
          test -x "$RUNNER_TEMP/sf-smoke/bin/raw_native_cli"
      - name: Upload combined release artifact
        uses: actions/upload-artifact@v4
        with:
          name: superframe-release-binaries
          path: dist/release/*
      - name: Attach assets to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Superframe $TAG" --generate-notes
          gh release upload "$TAG" dist/release/* --clobber
