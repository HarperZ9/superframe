name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python -m pip install -r packages/requirements.txt
      - run: npm run test:packages
      - run: npm run test:py
      - run: python packages/build_manifest.py --check
  buildlang-engine:
    # The DAW's real-time engine is BuildLang: build buildc at a pinned buildlang commit and hold the
    # BuildLang kernels to the Python reference, with no skipping (DAW_REQUIRE_NATIVE).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo install --git https://github.com/HarperZ9/buildlang --rev b80a93ca11764f9f840eac904e9f59e748556d88 --locked buildlang --bin buildc
      - run: python -m pip install -r packages/requirements.txt
      - run: python -m pytest -q -p no:cacheprovider --import-mode=importlib packages/daw/tests/test_native.py packages/daw/tests/test_clap.py packages/daw/tests/test_clap_organ.py packages/daw/tests/test_vst3.py
        env:
          DAW_REQUIRE_NATIVE: '1'
          BUILDC: buildc
      - run: buildc build --release packages/daw/bld
