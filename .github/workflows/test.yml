name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python -m pip install -r packages/requirements.txt
      - run: npm run test:packages
      - run: npm run test:py
      - run: python packages/build_manifest.py --check
      - run: npm run test:games
  buildlang-engine:
    # The DAW's real-time engine is BuildLang: build buildc at a pinned buildlang commit and hold the
    # BuildLang kernels to the Python reference, with no skipping (DAW_REQUIRE_NATIVE).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo install --git https://github.com/HarperZ9/buildlang --rev b80a93ca11764f9f840eac904e9f59e748556d88 --locked buildlang --bin buildc
      - run: python -m pip install -r packages/requirements.txt
      - run: python -m pytest -q -p no:cacheprovider --import-mode=importlib packages/daw/tests/test_native.py packages/daw/tests/test_clap.py packages/daw/tests/test_clap_organ.py packages/daw/tests/test_vst3.py packages/daw/tests/test_mpe.py
        env:
          DAW_REQUIRE_NATIVE: '1'
          BUILDC: buildc
      # The historical colour-mixing kernels: equality with the reference, planted defects and the fuzz run.
      - run: python -m pytest -q -p no:cacheprovider --import-mode=importlib packages/colourmix
        env:
          COLOURMIX_REQUIRE_NATIVE: '1'
          BUILDC: buildc
      - run: buildc build --release packages/daw/bld
      # The renderer in BuildLang: every moved module must reproduce the hash the C++ pins.
      - run: |
          buildc build --release native/bld
          ./native/bld/target/release/main | tee native-bld-out.txt
          grep -q "^modules identical to the C++: 1 of 1$" native-bld-out.txt
          grep -q "differs from the frame 0 pin: 1 of 1$" native-bld-out.txt
      # e-means: the study program is BuildLang end to end; its output must equal the stored results.
      - run: buildc run packages/emeans/bld/emeans.bld > emeans-out.txt && diff emeans-out.txt packages/emeans/results/emeans.txt
      # The registry unit table: every check must pass on the real table, the unbroken control table must
      # pass, and each broken table must fail on its own check and no other.
      - run: |
          buildc run packages/registry/bld/check.bld -- packages/registry/data/units.json | tee registry-out.txt
          grep -q "^all 14 checks passed$" registry-out.txt
          buildc run packages/registry/bld/check.bld -- packages/registry/bld/fixtures/good.json
          for f in packages/registry/bld/fixtures/*.json; do
            n=$(basename "$f" .json)
            if [ "$n" != good ]; then
              buildc run packages/registry/bld/check.bld -- --expect "$n" "$f"
            fi
          done
      # Plot Sheet: the package's own checks, the release build, the fixture's pinned bytes, and the make hook.
      - run: |
          buildc run packages/plot-sheet/bld/selftest.bld | tee plot-sheet-out.txt
          grep -q "^plot sheet tests passed: 57 of 57$" plot-sheet-out.txt
        env:
          PLOT_SHEET_BUDGET_MS: '4000'
      - run: |
          buildc build --release packages/plot-sheet/bld
          mkdir -p out/plot-fixture
          ./packages/plot-sheet/bld/target/release/main packages/plot-sheet/fixtures/mixed.plot out/plot-fixture/mixed --verify
          cd out/plot-fixture && sha256sum -c ../../packages/plot-sheet/fixtures/mixed.sha256
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test superframe/tests/plotsheet.test.mjs
        env:
          PLOT_SHEET_REQUIRE: '1'
