name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      # the name-art mosaic tests (about 100 s), the site-music composer tests (about 80 s) and the ear's eighteen planted
      # defects (several minutes) run here and stay out of the default tests
      - run: npm run test:slow
      - run: python -m pip install -r packages/requirements.txt
      - run: npm run test:packages
      # IntCal20 for the radiocarbon kernel: fetched from intcal.org and refused unless its SHA-256 matches
      - uses: actions/cache@v4
        with:
          path: packages/kernels/formulas/chron_radiocarbon_calibrate/curves
          key: radiocarbon-curves-intcal20-974a66649f2a
      - run: python packages/kernels/formulas/chron_radiocarbon_calibrate/curves.py fetch intcal20
      - run: npm run test:py
      - run: python packages/build_manifest.py --check
      # the GPU trace validator's README artwork: stored bytes must equal the digests in its receipts
      - run: python scripts/check_art_receipts.py
        working-directory: packages/quality/gpu-trace-validator
      - run: npm run test:games
      # build-color's README drawings: re-render each one and compare bytes, then check the stored digests
      - run: python tools/check_repo_art.py && python scripts/check_art_receipts.py
        working-directory: packages/colour/build-color
  buildlang-engine:
    # The DAW's real-time engine is BuildLang: build buildc at a pinned buildlang commit and hold the
    # BuildLang kernels to the Python reference, with no skipping (DAW_REQUIRE_NATIVE).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo install --git https://github.com/HarperZ9/buildlang --rev d63220f60a99e34d27537206974abf257f61a77a --locked buildlang --bin buildc
      - run: python -m pip install -r packages/requirements.txt
      - run: python -m pytest -q -p no:cacheprovider --import-mode=importlib packages/daw/tests/test_native.py packages/daw/tests/test_clap.py packages/daw/tests/test_clap_organ.py packages/daw/tests/test_vst3.py packages/daw/tests/test_mpe.py
        env:
          DAW_REQUIRE_NATIVE: '1'
          BUILDC: buildc
      # The historical colour-mixing kernels: equality with the reference, planted defects and the fuzz run.
      - run: python -m pytest -q -p no:cacheprovider --import-mode=importlib packages/colourmix
        env:
          COLOURMIX_REQUIRE_NATIVE: '1'
          BUILDC: buildc
      # IntCal20 for the radiocarbon kernel: fetched from intcal.org and refused unless its SHA-256 matches
      - uses: actions/cache@v4
        with:
          path: packages/kernels/formulas/chron_radiocarbon_calibrate/curves
          key: radiocarbon-curves-intcal20-974a66649f2a
      - run: python packages/kernels/formulas/chron_radiocarbon_calibrate/curves.py fetch intcal20
      # Formula kernels: every BuildLang body must give the reference's bytes, and every planted control fails.
      - run: python -m pytest -q -p no:cacheprovider --import-mode=importlib packages/kernels/tests/test_formulas.py
        env:
          FORMULAS_REQUIRE_NATIVE: '1'
          BUILDC: buildc
      - run: buildc build --release packages/daw/bld
      # The renderer in BuildLang: every moved module must reproduce the hash the C++ pins,
      # every planted perturbation control must fail closed, and cross-engine 100 Hz / Deja-VAE
      # numeric parity must hold with zero silent divergence.
      - run: |
          buildc build --release native/bld
          ./native/bld/target/release/main | tee native-bld-out.txt
          grep -q "^modules identical to the C++: 24 of 24$" native-bld-out.txt
          grep -q "differs from the frame 0 pin: 1 of 1$" native-bld-out.txt
          grep -q "^planted controls rejected: 24 of 24$" native-bld-out.txt
          grep -q "^art metrics identities verified: 1 of 1$" native-bld-out.txt
          grep -q "^parity invariants verified: 2 of 2$" native-bld-out.txt
      - run: python -m pytest -q -p no:cacheprovider --import-mode=importlib packages/world/tests/test_wave25f_buildlang_parity.py packages/world/tests/test_wave27c_cross_api_parity.py packages/world/tests/test_wave59d_engine_kernels.py packages/world/tests/test_wave80a_engine_batch2.py
        env:
          NATIVE_BLD_REQUIRE: '1'
          CROSS_API_REQUIRE_NATIVE: '1'
          BUILDC: buildc
      - run: python -m pytest -q -p no:cacheprovider --import-mode=importlib packages/world/tests/test_wave82h_engine_batch3.py packages/world/tests/test_wave85b_engine_batch4.py
        env:
          NATIVE_BLD_REQUIRE: '1'
          BUILDC: buildc
      # Low Water's world generator is BuildLang: the same seed must give the same bytes, every river
      # must run downhill to water, and a planted uphill river must fail (linux has node 20+ on the runner).
      - run: node --test games/low-water/world/tests/world.test.mjs
        env:
          BUILDC: buildc
      # The fourier lettering kernel is BuildLang: its resampling, descriptors, pixel-error cut and alignment must
      # give the browser twin's bits on real glyph outlines, and a kernel with one sum reassociated must not.
      - run: node --test lettering/native/fourier-native.test.mjs
        env:
          BUILDC: buildc
      # e-means: the study program is BuildLang end to end; its output must equal the stored results.
      - run: buildc run packages/emeans/bld/emeans.bld > emeans-out.txt && diff emeans-out.txt packages/emeans/results/emeans.txt
      # The registry unit table: every check must pass on the real table, the unbroken control table must
      # pass, and each broken table must fail on its own check and no other.
      - run: |
          buildc run packages/registry/bld/check.bld -- packages/registry/data/units.json | tee registry-out.txt
          grep -q "^all 14 checks passed$" registry-out.txt
          buildc run packages/registry/bld/check.bld -- packages/registry/bld/fixtures/good.json
          for f in packages/registry/bld/fixtures/*.json; do
            n=$(basename "$f" .json)
            if [ "$n" != good ]; then
              buildc run packages/registry/bld/check.bld -- --expect "$n" "$f"
            fi
          done
      # The registry radiocarbon lab table: every check passes on the real table, each broken table fails on
      # its own check alone, the lab IDs parse as expected, and the same IDs fail against a table without OxA.
      - run: |
          buildc run packages/registry/bld/labs.bld -- packages/registry/data/labs.json | tee labs-out.txt
          grep -q "^all 8 checks passed$" labs-out.txt
          for f in packages/registry/bld/fixtures/labs/*.json; do
            n=$(basename "$f" .json)
            if [ "$n" = good ]; then
              buildc run packages/registry/bld/labs.bld -- "$f"
            elif [ "$n" != no-oxa ]; then
              buildc run packages/registry/bld/labs.bld -- --expect "$n" "$f"
            fi
          done
          buildc run packages/registry/bld/labs.bld -- --ids packages/registry/bld/fixtures/labs/ids.tsv packages/registry/data/labs.json | tee labs-ids.txt
          grep -q "^PASS ids 17 of 17$" labs-ids.txt
          if buildc run packages/registry/bld/labs.bld -- --ids packages/registry/bld/fixtures/labs/ids.tsv packages/registry/bld/fixtures/labs/no-oxa.json; then
            echo "control failed: the lab IDs parsed against a table without OxA"; exit 1
          fi
      # Plot Sheet: the package's own checks, the release build, the fixture's pinned bytes, and the make hook.
      - run: |
          buildc run packages/plot-sheet/bld/selftest.bld | tee plot-sheet-out.txt
          grep -q "^plot sheet tests passed: 57 of 57$" plot-sheet-out.txt
        env:
          PLOT_SHEET_BUDGET_MS: '4000'
      - run: |
          buildc build --release packages/plot-sheet/bld
          mkdir -p out/plot-fixture
          ./packages/plot-sheet/bld/target/release/main packages/plot-sheet/fixtures/mixed.plot out/plot-fixture/mixed --verify
          cd out/plot-fixture && sha256sum -c ../../packages/plot-sheet/fixtures/mixed.sha256
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test superframe/tests/plotsheet.test.mjs
        env:
          PLOT_SHEET_REQUIRE: '1'
