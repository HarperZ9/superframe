name: native post-4k
# The post stack at 3840 x 2160 (tests/web/post_4k.py): a one-dimensional dispatch of 129,600 groups
# is refused by WebGPU and leaves the frame black while the render reports success. And the render
# tool's guards against that: GPU validation errors fail a render, and so do blank frames
# (tests/web/motion_blank_check.py, with its black-clip control).
on:
  pull_request:
    paths:
      - 'native/web/shaders/**'
      - 'native/web/motion/**'
      - 'native/web/raw-gpu.mjs'
      - 'native/web/frame-graph.mjs'
      - 'native/scripts/motion_render.py'
      - 'native/tests/web/post_4k.py'
      - 'native/tests/web/motion_blank_check.py'
      - 'native/web/test/post-4k.html'
      - 'native/web/test/pixel-4k.html'
      - '.github/workflows/native-post-4k.yml'
permissions:
  contents: read
defaults:
  run:
    working-directory: native

jobs:
  post-4k:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools (Playwright drives the installed Chrome; ffmpeg from imageio-ffmpeg)
        run: python -m pip install playwright==1.58.0 imageio-ffmpeg==0.6.0
      - name: dither, film and crt at 4K carry the image with no validation error, on the CPU adapter
        run: python tests/web/post_4k.py --adapter swiftshader --out post-4k.json
      - name: pixel art at 4K carries the image with no validation error (the splat-buffer clear), on the CPU adapter
        run: python tests/web/post_4k.py --adapter swiftshader --page pixel-4k.html --out pixel-4k.json
      - name: The blank-frame check fails a black clip and passes a pattern
        run: python tests/web/motion_blank_check.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: post-4k
          path: |
            native/post-4k.json
            native/pixel-4k.json
          retention-days: 30
          if-no-files-found: ignore
