name: render-sound
on:
  push:
    branches: [main]
    paths: ["render-sound/**", ".github/workflows/render-sound.yml"]
  pull_request:
    paths: ["render-sound/**", ".github/workflows/render-sound.yml"]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        working-directory: render-sound
        run: node --test
