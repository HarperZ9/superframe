<meta charset="utf-8">
<title>PCB Room</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{--bg:#0b0d12;--panel:#12151c;--line:#262b36;--fg:#e8e6df;--dim:#9a9ca3;--accent:#8fd3ff;--good:#7fd6a4;--warn:#ffc27a;--bad:#ff8f8f;
--ui:"Hanken Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--ui)}
#app{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100%;min-height:0}
#app.full{grid-template-columns:minmax(0,1fr) 0}
#app.full #panel{display:none}
#view{position:relative;min-width:0;min-height:0;background:#05060a;overflow:hidden}
#gl,#over{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#over{background:#07101c;touch-action:none;cursor:grab}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#labels span{position:absolute;font:11px var(--mono);color:#dfe6ee;white-space:nowrap;text-shadow:0 0 3px #000,0 0 3px #000;transform:translateY(-50%)}
#tabs{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 110px);z-index:3}
#tabs button{background:rgba(12,14,20,.78);padding:4px 9px;font-size:13px}
#hide{position:absolute;right:10px;top:10px;z-index:3;background:rgba(12,14,20,.78);padding:4px 9px;font-size:13px}
#status{position:absolute;left:10px;bottom:10px;z-index:3;font:12px var(--mono);color:#dfe6ee;text-shadow:0 0 3px #000;max-width:calc(100% - 20px)}
#panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding-block:12px;padding-left:14px;padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
h1{font-size:18px;font-weight:600;margin:0 0 4px}
details{border-top:1px solid var(--line);padding:6px 0}
summary{cursor:pointer;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:3px 0}
details>div{display:flex;flex-direction:column;gap:7px;margin-top:6px}
select,button,textarea{font:inherit;color:var(--fg);background:#1a1e27;border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
select{width:100%}
textarea{width:100%;font:11.5px/1.35 var(--mono);resize:vertical;min-height:44px;white-space:pre;overflow:auto}
button{cursor:pointer}
button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:82px minmax(0,1fr) 62px;align-items:center;gap:8px}
.row label{color:var(--dim);font-size:13px}
.row output{font:12px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
.btns{display:flex;flex-wrap:wrap;gap:6px}
canvas.mini{width:100%;background:#05060a;border:1px solid var(--line);border-radius:5px;display:block}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin:0;font-size:13px}
dt{color:var(--dim)}dd{margin:0;font:12px var(--mono);text-align:right;overflow-wrap:anywhere}
.note{font-size:12.5px;color:var(--dim);margin:0}
.unbuilt{font-size:12.5px;color:var(--warn);border:1px solid var(--warn);border-radius:5px;padding:6px 8px;margin:0}
.chk{display:grid;grid-template-columns:34px minmax(0,1fr);gap:2px 8px;font-size:12.5px;padding:4px 0;border-top:1px solid #1c2029}
.chk b{font:600 11px var(--mono)}.chk b.ok{color:var(--good)}.chk b.no{color:var(--bad)}
.chk span.n{grid-column:2;font:11px var(--mono);color:var(--dim);overflow-wrap:anywhere}
#err{position:absolute;inset:50px 16px 16px;color:var(--fg);white-space:pre-wrap;font:12px var(--mono);overflow:auto;z-index:4}
table{border-collapse:collapse;font:11.5px var(--mono);width:100%}td,th{padding:2px 4px;text-align:right;border-top:1px solid #1c2029;font-weight:400}th{color:var(--dim)}td:first-child,th:first-child{text-align:left}
@media (max-width:760px){html,body{height:auto}#app{grid-template-columns:1fr;grid-template-rows:60vh auto;height:auto}#view{height:60vh}#panel{border-left:0;border-top:1px solid var(--line);padding-left:max(14px,env(safe-area-inset-left,0px))}#app.full{grid-template-rows:100vh 0}#app.full #view{height:100vh}}
</style>
<div id="app">
<div id="view">
 <canvas id="gl" tabindex="0" aria-label="The board as a physical object. Drag to orbit, wheel or pinch to zoom, click to focus, arrow keys to orbit."></canvas>
 <canvas id="over" hidden aria-label="Drawing of the schematic, the board blueprint or the field across a cut. Drag to pan, wheel or pinch to zoom."></canvas>
 <div id="labels" aria-hidden="true"></div>
 <div id="tabs" role="group" aria-label="View"></div>
 <button id="hide" aria-pressed="false" title="Hide the controls">Controls</button>
 <div id="status" role="status" aria-live="polite"></div>
 <div id="err" hidden></div>
</div>
<div id="panel">
<h1>PCB Room</h1>
<p id="plain" class="note"></p>
<details open><summary>Design</summary><div>
 <select id="ex" aria-label="Example design"><option value="tia">Transimpedance amplifier, photodiode</option><option value="piezo">Piezo charge preamp</option><option value="honeycomb">Sensor array, honeycomb</option><option value="sunflower">Sensor array, sunflower</option></select>
 <div class="btns" role="group" aria-label="Layers"><button id="l2" aria-pressed="false">2 layers</button><button id="l4" aria-pressed="false">4 layers</button><select id="maskc" aria-label="Soldermask colour" style="width:auto;flex:1"><option value="purple">Purple mask</option><option value="green">Green mask</option><option value="black">Black mask</option></select></div>
 <textarea id="net" rows="9" spellcheck="false" aria-label="Netlist text"></textarea>
 <div class="btns"><button id="go">Generate from this netlist</button></div>
 <p id="neterr" class="note" role="status"></p>
</div></details>
<details open id="elecD"><summary>Live electrical view</summary><div>
 <div class="btns" id="modes" role="group" aria-label="Overlay"></div>
 <select id="nsel" aria-label="Net"></select>
 <div id="ctl"></div>
 <canvas id="legend" class="mini" width="300" height="34" aria-label="Colour scale" hidden></canvas>
 <canvas id="scope" class="mini" width="300" height="150" aria-label="Voltage at the driver and at the load against time" hidden></canvas>
 <p id="modeNote" class="note"></p>
</div></details>
<details id="secD"><summary>Section and exploded</summary><div id="secS"></div></details>
<details id="camD"><summary>Camera</summary><div><div id="camS"></div><p class="note" id="sps"></p></div></details>
<details open><summary>Measured</summary><div><dl id="read"></dl></div></details>
<details id="arrD" hidden><summary>Sensor layout</summary><div id="arr"></div></details>
<details id="drcD"><summary>Design rules</summary><div>
 <table id="rtab"></table><p class="note" id="rsrc"></p>
 <div class="btns"><button id="plant">Plant a fault and check again</button></div>
 <div id="drcOut"></div>
</div></details>
<details id="mfgD"><summary>Manufacturing files</summary><div>
 <p class="unbuilt">Unbuilt. Nobody has fabricated this board or opened these files in a commercial viewer. They need a fabricator's check before any order.</p>
 <select id="fsel" aria-label="File to show"></select>
 <textarea id="ftext" rows="12" readonly spellcheck="false" aria-label="File text, ready to copy"></textarea>
 <div class="btns"><button id="copy">Copy this file</button></div>
 <div id="rt"></div>
</div></details>
<details id="chkD"><summary>Known-answer checks</summary><div>
 <div class="btns"><button id="runchk">Run again</button></div><p class="note" id="chkSum"></p><div id="chkOut"></div>
</div></details>
</div></div>
<!-- ROOM-SCRIPT -->
