<meta charset="utf-8">
<title>Map Room</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* One canvas per job. Site kit and dynamic type port pending, as in the other rooms. Verdict colour is kept for status. */
:root{--bg:#0a0c10;--panel:#11141a;--line:#262b35;--fg:#e8e6df;--dim:#a3a5ac;--accent:#ffc978;--good:#7fd6a0;--warn:#ffc978;--bad:#ff8f7a;--ui:"Hanken Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;color-scheme:dark}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--ui)}
#app{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100%}
#view{position:relative;min-width:0;background:#000}#cv{width:100%;height:100%;display:block}
#panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
h1{font-size:18px;font-weight:600;margin:0}h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600;margin:0 0 6px}
section{display:flex;flex-direction:column;gap:7px}.btns{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:var(--fg);background:#1a1e27;border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-height:32px;cursor:pointer}button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--accent)}dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin:0;font-size:13px}dt{color:var(--dim)}dd{margin:0;font:12px var(--mono);text-align:right}#note{color:var(--dim);font-size:12px;margin:0}
@media (max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:60vh auto;height:auto}#panel{border-left:0;border-top:1px solid var(--line)}}
</style>
<div id="app"><div id="view"><canvas id="cv" role="img" aria-label="Three physical systems driven by one disturbance, or the registry of maps by status"></canvas></div>
<div id="panel"><h1>Map Room</h1>
<section><div class="btns" id="tabs"><button data-t="three" aria-pressed="true">One disturbance</button><button data-t="reg" aria-pressed="false">Registry</button></div><p id="note"></p></section>
<section id="ctl"><h2>Disturbance</h2><div class="btns" id="dist"></div><label>Drive <output id="dv"></output><input id="drive" type="range" min="0" max="1" step="0.001" value="0.25"></label></section>
<section id="rd"><h2>Measured</h2><dl id="read"></dl></section>
</div></div>
<script id="regdata" type="application/json">{{registry}}</script>
<!-- ROOM-SCRIPT -->
