format: lw-character/1
speaker: LAMB
name: Assessor H. Lamb
background:
  born: Unstated. Somewhere up the line; Hesk speech. Before the Shelf, a room in Hesk with a glass on the sill (CARBON, if Lamb drinks).
  trade: Night-shift loss assessor of the Mutual Indemnity of the Lower Shelf, eleven years. Answered Abel Strode's advertisement the winter Will Gannet died.
  family: Unstated. The player decides what Lamb says; the narration decides what Lamb notices.
  schooling: Claims practice, salvage law, the Shelf's forms.
  money: Wages through Hesk at "the usual rate". Seven shillings in the pound of them are the Alderman's, for six years.
wants: [A verdict by dawn that will stand., To stay dry.]
fears: [Getting it wrong in public. Getting wet.]
hides: [Whatever the player decides. Possibly the Hesk room.]
sees:
  town: A claim, then, if the player lets it, a town.
knows: [What Lamb has found tonight and nothing else (the knowledge-leak check reads the facts set).]
does_not_know: [Anything the facts and the Record do not hold.]
register: Lamb's spoken options are what Lamb says aloud, plain and short, in a claims assessor's English. Actions are plain imperatives.
vocabulary: [the claim, the Shelf, the time, the panel, the Daybook]
sentence_habits: [Asks for times and facts first., States one thing at a time.]
never_says: ['Theses about the town. Lamb asks and states facts; the arguments belong to other people.', '"That isn''t X. That''s Y." corrections.']
tics: [Writes things down in front of people.]
good_lines: ["A light, low, in the drowned lamp. It turned us off the Spit."]
the_wound:
  source: The lead's calibration scene, design/VOICE-CALIBRATION.md, 2026-10-21, pending the author's
    reaction. Not the story lead's; recorded here so the sheet is complete.
  what_they_did: Eleven years ago, drinking, Lamb assessed the loss of the ferry Margaret off the point,
    nine drowned, one of them the cook's boy of fourteen. Lamb put a hand straight through the rotten
    housing of a pump and got rust on the cuff, ate the owner's dinner on the Tuesday, and wrote weather
    on the Friday. The boy's mother wrote to Lamb. The letter is in the inside pocket of the claims case,
    unopened, carried to every job since.
  the_lie_they_live: I got sober that week. Everyone shook my hand for it.
