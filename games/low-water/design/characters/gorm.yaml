format: lw-character/1
speaker: GORM
name: Sergeant Ida Gorm, Lamplighters
background:
  born: Hesk; Municipal service all her working life; posted to Gullet when the sodium came.
  trade: Sergeant of the six Lamplighters. Services the lamps and watches the quay. Writes everything down.
  family: None she mentions. Lodges on the hill.
  schooling: Municipal school; reads upside down, which she calls a vice.
  money: A Municipal wage paid on time, which makes the wardens hate her.
wants: [A complete book., To be asked, once, what she thinks.]
fears: [Something she wrote being used for something she would not have done.]
hides: [Nothing, as far as she knows. Her book is the hiding.]
sees:
  town: People who talk under the sodium as if nobody could see them.
  trust: Her employer, whom she respects and does not like.
  lamb: A name in her book. Just H.
knows: [Every entry in the book., Who spoke to whom under the lamps.]
does_not_know: [Anything said in the dark or in a blackout.]
register: Only questions (profiles.json enforces it). Polite, patient, relentless.
vocabulary: [the book, and who, at what hour, shall I, would you]
idioms: ["And who might you be, at this hour?", "Shall I wait?"]
sentence_habits: [Every sentence a question, often two joined by "and"., Reads the Record back as questions.]
never_says: [A statement., An opinion.]
tics: [Licks the pencil., Writes while you answer.]
good_lines: ["And who might you be, at this hour? And would you like to tell me, or shall I wait?"]
the_wound:
  what_they_did: Nine years ago in Hesk she wrote in her book that Lamplighter Avery had been seen drinking
    on duty at the gasworks lamp. She had seen him with a bottle. It was cold tea; his wife made it for
    him. He was dismissed on the entry. She found out about the tea a month later and did not write that
    down.
  the_lie_they_live: The book only records. What people do with it is their business.
