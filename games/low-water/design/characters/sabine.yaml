format: lw-character/1
speaker: SABINE
name: Sabine Brine, landlady of the Brine
background:
  born: Gullet, on the floor at low water, more or less; her mother was gathering cockles. Grew up with Wenna Tallow, two doors apart.
  trade: Keeps the Brine, a public house built in an upturned hull. Pulls pints, pickles eggs, lends money, buries arguments, bakes bread in an oven she also uses for other things.
  family: Widowed. Jory, her husband, died eleven years ago; she keeps the bar clock eleven minutes slow and does not explain it. No children. Pip Gannet works for her and is the nearest thing.
  schooling: The Gut's dame school until twelve. Reads the Hesk paper for the prices and the deaths.
  money: The Brine's takings, the slate (half the town owes her a little; she prefers it), and a small brewer's debt in Hesk she pays on time to the day. Teague's column runs nine years, paid by his sister's postal orders.
wants:
  - Wenna kept out of trouble.
  - The Brine left alone by the Board and the Lamplighters.
  - The slate paid, slowly, so people keep coming back.
fears:
  - The Lamplighters, who have started drinking in her bar and listening.
  - Wenna going up the stairs one night and not coming down.
  - Being thanked in public.
hides:
  - She casts Wenna's green prisms in the bread oven from her own empties.
  - Wenna never left the Brine on Low Night; Sabine's "left at nine" is a lie she tells well.
  - She lets Teague drink on the slate knowing exactly what it does to him, because if she stops he will drink at the Gut where nobody watches.
sees:
  town: Everybody owes somebody, and the Brine is where they come to say so.
  board: Keel drinks for nothing and calls it the Board's account. Board men pay in Board paper she cannot spend.
  trust: The hill sends her a Lamplighter a night and never a customer.
  guild: Good drinkers, bad payers, loyal.
  lowco: Merrow pays in coin. She likes that and does not ask where from.
  kell: Kell crews drink quietly and pay. She would not have one to dinner.
  lamb: A chit with a coat on. Then, if it earns it, a regular.
knows:
  - Who owes what to whom in Gullet, to the farthing.
  - That Wenna sat by the stove all Low Night.
  - What goes in the oven and why.
does_not_know:
  - The Shelf's real typist, or Crake's drafts.
  - What the Guild's switch did to Mother, beyond the dark.
register: Quick, warm, transactional. Prices in almost every sentence, which makes the lines without one land.
vocabulary: [chit, slate, love, a penny, tuppence, column, the stove, my oven, regulars, custom]
idioms:
  - "A penny, and a straight answer's tuppence."
  - "On the slate."
  - "I'm not a saint, I'm a hull."
sentence_habits:
  - Prices first, then the real answer, or no real answer.
  - Changes the subject to food when it gets near Jory or Wenna.
  - Lies with complete confidence and a smile that asks you to admire it.
never_says:
  - Definitions of what a slate "is". She says what she does with it.
  - Speeches. She is always doing something with her hands while she talks.
  - Jory's name with a price beside it.
tics:
  - A pickling fork behind one ear like a pencil.
  - Chalks something on the slate and rubs it out while thinking.
  - Calls everyone "love", Board men included, which they hate.
good_lines:
  - "Pickled egg, a penny. A straight answer, tuppence. I'm out of straight answers. The egg's very good."
  - "Shelter's free tonight, love. The rum isn't."
  - "Mind your feet, love. It's over the step."
the_wound:
  what_they_did: Every bread night she lifts the crate of Wenna's empties onto the oven shelf with her
    forearms because the handles are gone, and she sets the moulds, and she does it humming so she doesn't
    think. On Low Night she fired it at eight. And for nine years she has poured Orrin Teague his first
    one at eleven in the morning, before she has poured her own tea, because if she doesn't he'll go to
    the Gut where nobody watches, and she has never once poured it slower.
  the_lie_they_live: Wenna left at nine. I'm a hull, not a saint. Better he drinks where I can see him.
