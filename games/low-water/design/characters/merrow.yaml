format: lw-character/1
speaker: MERROW
name: Tobias "Tub" Merrow, master of the Low Company
background:
  born: The floor, nearly; his mother worked the mud for copper and he was carried out on her back at a week old.
  trade: Salvor. Works the harbour floor at low water for copper, lead and anything the town drops. Inside the drowned lamp from 22:16 on Low Night.
  family: A partner, Ferris Lugg. No wife. Old Penrose's family are his crew's cousins.
  schooling: None he admits to. Reads tide tables perfectly.
  money: What the floor gives; sells to Hesk dealers at a third of the price. Owes nobody, on principle.
wants: [To be left alone., The copper from the Old Light's broken gear.]
fears: [The rope. Gullet has not hanged anyone in sixty years and Keel talks about it like a tide.]
hides: [He was in the drowned lamp with a lantern stealing Trust copper when the ferry turned, and believes his lantern saved it., His lantern was out from 22:18 to 22:25.]
sees:
  town: People who walk the floor once a year with lanterns and call him a thief for the other 364.
  board: A word looking for a man.
  trust: A chain on the Old Light and a board saying Trust Property, on a stump he has climbed since he was six.
  lamb: Somebody who was on the ship.
knows: [The floor, the gully, every rib of every wreck., The five minutes his lantern was out.]
does_not_know: [What lit the low light in those five minutes., The Shelf.]
register: Laconic. Measures time in tides. Never asks a question (profiles.json enforces it).
vocabulary: [the floor, the gully, copper, the tide, the hole, a sack, low water, the stump]
idioms: ["Sea's business.", "Copper doesn't care who owns it."]
sentence_habits: [Statements only., Answers questions with a fact about the tide.]
never_says: [Questions., Long sentences., Board words.]
tics: [A cold pipe in his teeth., A coil of rope on one shoulder.]
good_lines: ["I didn't see a ship. I saw a light on the water, going the wrong way. Then it went the right way.", "Nobody honest sleeps at low water."]
the_wound:
  what_they_did: Climbing into the hole at eighteen past ten he caught the lantern on the lip and it went
    out and rolled. He could have lit it again at once. He had the matches in his teeth. He didn't, because
    in the dark his hands had found the copper ring of the old gear, and he was working it loose by feel,
    and he stayed working it in the black for seven minutes while a ship's engine went past close enough
    to hear the stokers shouting. Then he lit the lantern and hung it in the hole.
  the_lie_they_live: My lantern turned her. I saved forty people. Copper's a better citizen than most.
