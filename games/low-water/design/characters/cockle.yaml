format: lw-character/1
speaker: COCKLE
name: Nan Cockle, salvor
background:
  born: The floor, eighty-odd years ago; has worked it since she was five.
  trade: Salvor with a cockle rake. Remembers the Old Light with a door.
  family: Outlived two husbands and a son. Grandchildren in Hesk who send oranges.
  schooling: None.
  money: The floor, a little; the Brine's stove for free since Jory died.
wants: [One more Low Night., Somebody to listen to the list.]
fears: [Forgetting the order of the Low Nights.]
hides: [Nothing. She has outlived hiding.]
sees:
  town: Five Low Nights this low, in order.
  board: Young.
  lamb: Somebody new to tell the list to.
knows: [Every Low Night by number and what the floor gave up., The last hanging, the spring after her second Low Night: a Kellish boy off a collier.]
does_not_know: [Anything technical: the switch, the clause.]
register: Counts everything in Low Nights by number (EDITOR-NOTES S7). Old Gullet, funny, unhurried.
vocabulary: [Low Night, the floor, my first, my second, the door, rake]
idioms: ["Ask me when it's raining properly. I tell it better wet."]
sentence_habits: [Numbers the memory before telling it., Wanders and comes back exactly.]
never_says: ['"Manners" or other short sea proverbs (EDITOR-NOTES S7).']
tics: [Taps the rake twice before she starts.]
good_lines: ["Low Night. This is my fifth this low. The first, a pram wheel; I was five.", "It had a door, when I was a girl."]
