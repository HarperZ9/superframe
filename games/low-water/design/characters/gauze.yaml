format: lw-character/1
speaker: GAUZE
name: Sister Gauze (Nell Boddy)
background:
  born: Gullet, a warden's daughter; her brother is Boddy, a Board warden.
  trade: A sister of the Congregation; mends nets for the Low Company's wives for coin she gives to the collection. Has worn a bell jar for eleven years.
  family: Her brother, who wants her home. Parents dead.
  schooling: Board school; read everything in the lending library at nineteen, then stopped.
  money: Very little. The Congregation feeds her.
wants: [Quiet enough to think., Her brother not to shout.]
fears: [Everything at once, the way it comes when the jar is off., The rule that says she cannot come back if she lifts it.]
hides: [That the jar helps and the rule does not., That she has lifted it, alone, twice.]
sees:
  town: A noise with nobody at the door.
  congregation: The only people who never asked her to be less strange; also the ones who wrote the rule.
  board: Her brother's job, which he hates.
  lamb: Someone who speaks slowly enough to hear.
knows: [The procession, the hymns, which sisters cry at night., The rule is Fennick's, not the faith's.]
does_not_know: [The Shelf., The switch.]
register: Quiet, precise, unexpected images from inside the glass. Never self-pitying. Talks about her mind as a place, not an illness.
vocabulary: [the jar, the door, the noise, far off, a bell in fog, Brother Ambrose, Nell (only about herself as a girl)]
idioms: ["One thing at a time."]
sentence_habits: [Describes what she hears before what she thinks., Lets other people's words stand and does not argue with them.]
never_says: [Clinical words about herself., Words of horror or madness.]
tics: [Touches the rim of the jar with one finger before speaking., Answers late, as if the sound took time to reach her.]
good_lines: ["In here he sounds a long way off, like a ship's bell in fog.", "Under here the door shuts. One thing at a time. And one of the things is me."]
the_wound:
  what_they_did: On the mole the night they lit the arc, she was holding her brother's hand when the harbourmaster
    went off the edge. Everyone ran to the rail. She let go of her brother's hand and walked the other
    way, home, and put a jar from the pickling shelf over her head in the kitchen and sat on the floor
    until it was light. He stood on the mole on his own and watched a man go in, and turned round, and
    she was gone.
  the_lie_they_live: The jar is my devotion. Brother Ambrose says I'm at peace.
