format: lw-character/1
speaker: BODDY
name: Boddy, Board warden
background:
  born: Gullet, a warden's son, the younger brother of Nell (Sister Gauze).
  trade: Board warden under Sallis; strips the barges with him on Night 2.
  family: His sister under the jar, eleven years. Unmarried. Lives in their parents' house with her room kept.
  schooling: Board school.
  money: Unpaid with the other wardens.
wants: [His sister home., Somebody to say the rule is wrong.]
fears: [That she is happier where she is.]
hides: [He shouts at the Congregation because he cannot shout at her.]
sees:
  congregation: The people who took his sister and called it peace.
  lowco: Copper thieves, which is nothing next to it.
  lamb: The Shelf, who might say so in writing.
knows: [The night she put the jar on: the arc lit, Keel went off the mole, she was holding Boddy's hand., The rule.]
does_not_know: [That the rule is Fennick's and not the faith's.]
register: Loud in public, mocking, cruel to the jars, and then very plain and quiet about Nell.
vocabulary: [fishbowls, Nell, the rule, the deacon, home]
idioms: ["Knock twice for the Lord."]
sentence_habits: [Starts with a jeer and ends with his sister., Generalises when angry and takes it back to one man when pressed.]
never_says: [Neat contrasts ("These steal people"). He says what happened to Nell.]
tics: [Talks to the jar as if she can hear (she can)., Stands too close.]
good_lines: ["She was holding my hand on the mole the night they lit the arc and the harbourmaster went in."]
