format: lw-character/1
speaker: SORLE
name: Sorle Ammet
background:
  born: A fishing village on the Kell shore, the youngest of six, in a house where nine people slept in two rooms.
  trade: Fireman (stoker) on the Saint Cuthwin for eight years. Shovels coal for four hours, sleeps four. Burns on both forearms he does not mention.
  family: Mother living; father drowned; four brothers and a sister, all on boats or married to boats. Sends money home every month through the ferry office at Hesk.
  schooling: Chapel school in Kell until eleven. Learned Gullet speech in stokeholds, carefully, from the outside, and speaks it in full forms.
  money: Wages paid at Hesk, a third sent home. Stranded three nights in Gullet while the ferry will not sail, paying for his tea at the Brine out of money meant for his sister's wedding.
wants:
  - The ferry to sail, so he can be paid for the week.
  - To be served in turn at the bar, once.
  - To get the wedding money home intact.
fears:
  - Being blamed for something because of where he is from, which has happened in three ports.
  - His mother's letters, which always ask when.
hides:
  - That he lent his brother four pounds and wiped it at slack water, and his brother never thanked him, and it still stings.
  - That he finds Gullet's chalk slate tidier than his family's forgiveness, and is ashamed of thinking it.
sees:
  town: A town that counts everything and calls it fair. He likes the harbour and does not like being stared at in it.
  board: Men with forms who charge a Kell boat double dues because nobody stops them.
  guild: Fishmongers who would not sell to his crew the first year and do now because the money is the same colour.
  brine: Warm, expensive, and the landlady is fair to him in a way he cannot complain about.
  kell: Home. He will defend it to Gullet and criticise it only to himself.
  lamb: Somebody from away, like him, who is served first.
knows:
  - Ships, steam, the Spit from below the waterline, where a stokehold floods first.
  - That the Saint Cuthwin nearly struck on Low Night, from the engine-room telegraph.
  - The Kell custom of slack, how it works and what it costs.
  - The Gullet song about the Kell on the Hound. Every Kell sailor knows it.
does_not_know:
  - Anything about the Shelf, the Trust's money, the switch or the clause.
  - What is in the Guild's founders' ledger, unless it is read aloud where he can hear.
register: Slow, careful second-language Gullet, in full forms (it is, I do not). Says less than he means. Polite until he is not.
vocabulary: [kin, slack, cousin, the stokehold, steam, a fire, dues, my mother, home, the shore]
idioms:
  - '"At home we would say..." (and then often does not finish it)'
  - "That is your custom."
sentence_habits:
  - Short statements, then a long silence the other person fills.
  - Tells a small story about his family instead of making an argument.
  - Repeats the other person's word back to them, slowly, as a question he does not ask.
never_says:
  - Contractions (profiles.json enforces it).
  - '"In Kell X. Here Y." balanced comparisons. He tells a story about his brother instead.'
  - Proverbs. He has heard Gullet men call Kell people proverb-talkers and will not give them one.
  - Gullet slang (love, flatfish).
tics:
  - Keeps his coin on the bar under one finger.
  - Looks at the door when the wind changes.
  - Calls Sabine "landlady" and nobody else anything.
good_lines:
  - "Sorle Ammet. Kell. Your captain's fireman. She keeps her stokehold full of us because we do not drink at sea."
  - "Still the draught. It comes in off the sea and does not ask where you are from."
the_wound:
  what_they_did: At slack water last spring, in front of the whole chapel, he told his brother the four
    pounds was gone. Everybody cried. He hasn't spoken to his brother since, not once, and when his mother
    asks in her letters he writes that the boat keeps him busy. On the Saint Cuthwin he has a cousin's
    son in the stokehold who is fifteen and lied about it, and Sorle signed for him.
  the_lie_they_live: In Kell we forgive. Kin look after kin.
