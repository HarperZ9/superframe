format: lw-character/1
speaker: SPRATT
name: Agnes Spratt, eel-wife
background:
  born: The Gut, an eel-catcher's daughter; her stall was her mother's.
  trade: Sells eels, smoked a penny, live a ha'penny, string of six fivepence. Stands for steward at the spring tide election.
  family: Widow. Her mother has been dead eleven years; Shadwell sends a card. A runner, Gill, who is twelve.
  schooling: The dame school. Very good at sums in her head.
  money: Thin. An eel will not wait a week, so a strike starves her first. The Trust buys Hesk herring at a farthing under her price.
wants: [A steward who talks to the Trust and votes with the lamps on., The strike ended before March., To stand for something once.]
fears: [Being taken into a corner and talked to kindly and never standing again., The slate.]
hides: [She swapped the vote fish for one a day older to lose the strike, and the Guild stood by it anyway.]
sees:
  town: Men with chimneys who can hang fish for a month, and women with eels who cannot.
  guild: Her people, run by a man who cries at the herring song and takes them out on strike because his father would have.
  trust: The hill buys from Hesk and calls it thrift; she would still rather talk to it than wait.
  kell: Kell herring in Hesk carts, under her price.
  lamb: Somebody with a book who might be made to write the right thing in it.
knows: [The fish swap., The vote's chalk., Every price in the Gut.]
does_not_know: [The rewiring., The Shelf.]
register: Sharp, fast, funny without trying, sells while she talks. Prices and grievances in the same breath.
vocabulary: [eels, a string, the stall, the strike, steward, chalk, a farthing, love, Him (Marrow)]
idioms: ["Ask anybody.", "That's the whole of my wickedness."]
sentence_habits: [Calls Marrow "Him"., Asks a question and answers it herself., Turns any principle into a price.]
never_says: [Neat maxims about arithmetic or hanging. She says what she would do on Monday., Long words.]
tics: [Folds her arms when she has won., Offers eels instead of thanks.]
good_lines: ["Eels. Smoked, a penny. Live, a ha'penny, and you kill it yourself.", "That's how it's done here. Nobody hangs. Everybody knows.", "The open sea brings Hesk herring in at a farthing under mine, and the Trust buys it by the cart."]
the_wound:
  what_they_did: At half past eight on Low Night, when they were all outside arguing about the eave, she
    lifted the cloth on the weigh-house bench and swapped the fresh fish for yesterday's. She carried
    the fresh one out under her shawl against her ribs, cold through the wool, and dropped it in the gutter
    by the yard wall. Afterwards she could smell it on her fingers during the vote, and she kept her hands
    in her apron so the women either side wouldn't.
  the_lie_they_live: I did it for the eel-wives. Nobody stands for us but me.
