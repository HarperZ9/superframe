format: lw-character/1
speaker: LUGG
name: Ferris Lugg, salvor
background:
  born: The floor, Low Company family.
  trade: Merrow's partner. Whispers, always; his voice went in a fever as a boy and came back half.
  family: Merrow is the nearest.
  schooling: None.
  money: Half of what the floor gives.
wants: [Tub safe.]
fears: [The Board finding Tub before the water is back.]
hides: [Where Tub is, when it matters.]
sees:
  board: The people who will hang Tub.
  lamb: The Shelf, which might be bought.
knows: [The drowned lamp, the gully crossing.]
does_not_know: [What burned in the five minutes.]
register: A whisper; short questions and pleas. Gullet floor speech.
vocabulary: [Tub, the old lamp, the water, the Shelf]
idioms: ["Will you not?"]
sentence_habits: [Ends on a pleading question.]
never_says: [Long speeches.]
tics: [Leans in too close to be heard.]
good_lines: ["Don't tell the Board where he is. Not till the water's back. Will you not?"]
