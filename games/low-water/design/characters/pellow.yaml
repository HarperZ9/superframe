format: lw-character/1
speaker: PELLOW
name: Mrs Pellow, Crake's housekeeper
background:
  born: The Gut; went up the hill into service at fourteen.
  trade: Housekeeper to the Alderman for twenty years. Has never seen her employer's eyes behind the yellow lenses. Carries the Alderman's letters, including the crossword to Mrs Gannet.
  family: A husband on the coal boats, a daughter married in Hesk, a son who is a Lamplighter's apprentice on her word.
  schooling: Dame school in the Gut.
  money: Thirty shillings a month and her dinner. Her son's place depends on the Alderman.
wants: [Her son kept on., The kettle to stop being used on the Alderman's letters.]
fears: [Losing the place, and her son's with it., Being asked what she carries.]
hides: [She steamed one letter open once and has never stopped feeling it.]
sees:
  town: Where she came from, and goes down to on Sundays.
  trust: Her wages, her son's wages.
  lamb: Somebody who will say things up the hill that she has to clean up after.
knows: [The Alderman's habits, her crossword, the errand to the Ropewalk.]
does_not_know: [What the drafts are for.]
register: Kind, tired, plain, Gut vowels softened by the hill. Talks about the house, not the Alderman.
vocabulary: [the house, the kettle, her letters, thirty shillings, my lad, up the hill]
idioms: ["Mind the step."]
sentence_habits: [Answers a question about the Alderman with a fact about the house., Apologises before disagreeing.]
never_says: [Anything against the Alderman by name., Politics.]
tics: [Wipes her hands on her apron before taking anything.]
good_lines: ["I'm on her books too, assessor. Thirty shillings a month and my dinner."]
