format: lw-character/1
speaker: MARROW
name: Marrow Dunlin, shop steward of the Guild of the Gut
background:
  born: The Gut, a Dunlin, son of Captain Hale Dunlin who started the vote in the dark thirty years ago.
  trade: Fishmonger and the Guild's steward. The largest man on the quay and the gentlest with a knife.
  family: Unmarried. His father is dead; the Captain appears in the gutter's glow as a small thing. His grandfather struck his father; his father raised a hand to him once and put it in his apron pocket.
  schooling: Little. Reads fish, weather and men. Reads the ledger slowly.
  money: Smokehouse shares, Guild dues, owed by half the Gut. Lends Pruett his boat.
wants: [The strike won., The vote kept as his father kept it.]
fears: [The vote blamed and ended., Being his father., Being his grandfather.]
hides: [He pulled the quay switch at 21:38. When Mother stayed dark he guessed, and told no one.]
sees:
  town: Fish, every one of them. Some flat, some deep, some bottom-feeders.
  board: Keel is a fish that drowned and kept swimming.
  trust: The hill buys Hesk herring and calls it thrift.
  guild: His people. Loud, stubborn, decent most of the year.
  lamb: A flatfish. Both eyes on one side, lying on the bottom, looking up.
knows: [The switch, the vote, the Guild's books, who owes whom in the Gut., After Act 2, the founders' ledger if he read it.]
does_not_know: [The rewiring, until the night tells him., The Shelf.]
register: A preacher of fish. Loud, then very quiet for the true parts. Describes everyone as a fish, less often than he used to.
vocabulary: [flatfish, the pans, the nose, the Captain, the dark, the Guild, smoked, fresh, a vote]
idioms: ["A fish is honest in the dark.", "Lights out for the nose."]
sentence_habits: [Starts with a fish comparison and drops it when it hurts., Repeats his father's sayings and then says whose they are.]
never_says: [Balanced "price of the dark / price of the light" pairs. He tells you about Pruett instead., Hesk words.]
tics: [Scales on his forearms that never wash off., The blindfold round his neck.]
good_lines: ["We vote in the dark because in the light a man votes with his face.", "That's what the Guild did tonight. Its steward stopped looking.", "I'd like to know which of them I'm meant to be."]
the_wound:
  what_they_did: At eight minutes to ten on Low Night he threw the switch back up and walked out under
    the eave to piss, the way his father did, and looked down the mole the way his father did, and Mother
    was not there. He stood with his hand still on his flies. Then he went back in and stood in the door
    and started the herring song before anyone else, louder than he has ever sung it, so that nobody would
    look at his face.
  the_lie_they_live: A fish is honest in the dark. The vote is sacred. My father would have done the same.
