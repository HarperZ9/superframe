format: lw-character/1
# Three child speakers on one sheet each below. Children speak as children: about prices, games,
# fairness and what adults told them, never about the town's ideas. No harm to a child is shown.
people:
  - speaker: DILLY
    name: Dilly Rudd
    background: {born: The floor, a salvor's youngest., trade: Runs a book on the fish., family: Mother and father in the Gut; the Ruddles., schooling: Board school when the tide allows., money: Farthings held on the book.}
    wants: [The fish to live and the book to pay.]
    fears: [Grown-ups touching the horse (the fish).]
    sees: {town: A book with odds on it.}
    register: Fast, bossy, a bookie's patter in a child's mouth.
    never_says: [Adult morals.]
    good_lines: ["Lives is fours. Dies is evens.", "We call her the Alderman. Same mouth."]
  - speaker: TOBIT
    name: Tobit Quill
    background: {born: Gullet, choirboy of the Congregation., trade: Makes hymns and charges a penny, as Sabine told him., family: His mother in the Congregation; father on the boats., schooling: Board school; the hymns., money: Pennies for hymns.}
    wants: [To be paid for the hymn.]
    fears: [Taking his jar off in front of the deacon.]
    sees: {congregation: Home.}
    register: Rhyming hymns, prices, earnest.
    never_says: [Doubt in words; he shows it by counting.]
    good_lines: ["The lamps went pink. I made a hymn about it. Do you want the hymn? It's a penny."]
  - speaker: GILL
    name: Gill, Spratt's runner
    background: {born: The Gut., trade: Runs messages for Agnes Spratt., family: Spratt's cousin's boy., schooling: Little., money: A ha'penny a message.}
    register: Breathless, one line at a time.
    good_lines: []
