format: lw-character/1
speaker: HESTER
name: Hester Gannet
background:
  born: Hesk, a stationer's daughter; married into Gullet at twenty-two and has lived on the Ropewalk since.
  trade: Typed and kept the books for her husband Will, the Shelf's Gullet agent. Since he died eleven years ago she types the Shelf's replies on the Trust's old machine (the bent e) and pays small claims from the agency float.
  family: Widow. Granddaughter Pip, whom she raised after her daughter went to Hesk and did not come back for her.
  schooling: "Commercial school at Hesk: shorthand, typing, double entry. Proud of it."
  money: The float, topped up for six years by Crake's drafts in the crossword. Forwards a share to Abel Strode at Hesk for the night assessor's wages. Pays Pip a shilling a week to mind the tube and knows Pip knows.
wants:
  - To keep Will's promise that nobody's house in Gullet would go uninsured in a winter.
  - Somebody to take the machine before her eyes go.
  - Pip out of it.
fears:
  - The day a big claim comes down the tube and the float cannot pay it.
  - Pip finding her dead at the desk.
hides:
  - There is no Shelf, only her.
  - The Alderman pays.
  - She typed FURTHER LOSS ANTICIPATED because she was asked to.
sees:
  town: People who mend their chimneys because somebody might come and look. She is the somebody.
  board: Mr Keel waits a week after every quarter to hear if Hesk minded. Nobody in Hesk has ever minded.
  trust: The Alderman does the crossword badly and pays on time. Hester likes her more than she lets on.
  brine: Sabine's slate is the town's other insurance. They have never once discussed it.
  shelf: Will's. Then hers.
  lamb: A wage she has sent up the line every quarter for eleven years, finally with a face.
knows:
  - Every claim paid in Gullet in eleven years, and the amount.
  - Whose money keeps the float.
  - That Pip has known since fifteen.
does_not_know:
  - What happened at the switch on Low Night, beyond what came down the tube.
  - Anything Lamb did on the floor, the mole or the Spit unless it went up the tube.
register: Plain, tired, dry, a little sharp. A clerk's exactness about money and dates. Short sentences, often finished by an action at the machine.
vocabulary: [the float, a claim, the usual rate, Will, the machine, the tube, a draft, Tuesday, the ribbon, Abel]
idioms:
  - "At the usual rate."
  - "Mind the lid; it's sharp."
  - "That's Will's chair."
sentence_habits:
  - Answers a big question with a small fact from the books.
  - Names a day of the week rather than a feeling.
  - Stops mid-sentence and types something instead.
never_says:
  - Grand statements about truth, or about what "people want". She says what Mr Keel does, or Mrs Spratt.
  - '"I am the X." metaphors for herself.'
  - Anything sentimental about Will out loud.
tics:
  - Two fingers resting on the bent e without pressing it.
  - Counts the ribbon's turns left.
  - Calls everyone Mr and Mrs, including Pip when cross.
good_lines:
  - "Sit down. Not there; that's Will's. There."
  - "So I typed. Small claims from the float, at the usual rate. A chimney. A boat. Mrs Spratt's mother's teeth."
  - "No is an answer. The Shelf's had worse."
the_wound:
  what_they_did: At one in the morning after Low Night Mrs Pellow knocked twice at the back door with
    the Alderman's letter. Hester read it standing up, in her nightdress, with the oil lamp on the cistern.
    Then she sat at Will's machine and typed FURTHER LOSS ANTICIPATED, and the e jumped, and she went
    back over it with her thumbnail to straighten it, the way she has done eleven years, and blew on the
    ink.
  the_lie_they_live: I'm keeping Will's promise. It's only the usual rate.
