format: lw-character/1
speaker: HOBB
name: Constant Hobb, Lamplighter third class
background:
  born: The Gut; his mother is Mrs Pellow's cousin, who got him the place.
  trade: Youngest Lamplighter. Carries two lanterns in case one goes.
  family: His mother and three sisters; he is the wage.
  schooling: Board school; counts everything when frightened.
  money: A Lamplighter's pay, all of it home.
wants: [To keep the place., Not to be asked to hurt anyone.]
fears: [The dark., Sergeant Gorm's book, with his name in it.]
hides: [He saw who went near the quay board at twenty to ten.]
sees:
  town: Home, which he now watches for the hill.
  lamplighters: A job; the sergeant, whom he admires and fears.
  lamb: Somebody who is kind to him, which is suspicious.
knows: [He counted eight hundred and forty seconds of dark., Who stood where at 21:38.]
does_not_know: [Why the lamps came back pink.]
register: Apologetic, young, over-polite, counts aloud. Tangled forms of address.
vocabulary: [Sergeant, sorry, two lanterns, third class, eight hundred and forty]
idioms: ["Sorry. Sir. Madam. Assessor."]
sentence_habits: [Apologises first., Gives a number when he cannot give an answer.]
never_says: [Anything against the sergeant.]
tics: [Checks both lanterns.]
good_lines: ["Two lanterns. In case one goes. Sergeant says it's a waste of oil. Sergeant's never had one go."]
the_wound:
  what_they_did: At twenty to ten he was under the weigh-house eave with both lanterns lit and he saw
    a big man go to the board and pull the switch. He knew who it was. He didn't write it down. He counted
    instead, out loud, all eight hundred and forty seconds, so that when the sergeant asked, all he'd
    have was a number.
  the_lie_they_live: I was counting. I didn't see anyone. I only counted.
