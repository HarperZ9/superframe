format: lw-character/1
speaker: PIP
name: Pip Gannet
background:
  born: Gullet; raised by her grandmother Hester on the Ropewalk after her mother went to Hesk.
  trade: Pot girl at the Brine; minds the tube in the weigh-house for a shilling a week.
  family: Hester. Her mother in Hesk, who writes at Christmas.
  schooling: Board school; reads well and says she doesn't.
  money: Wages from Sabine, the shilling from Hester (she knows it is her grandmother's).
wants: [Her grandmother not to be found out., Out of Gullet some days, never on others.]
fears: [The day the tube brings something the float can't pay.]
hides: [She has known since fifteen who types the Shelf.]
sees:
  town: Her whole life. Feels the tide in her knees.
  brine: Work, and Sabine.
  lamb: The person the tube thumps for.
knows: [The tide by her knees., The bent e., Who types it.]
does_not_know: [The Alderman's drafts, in detail.]
register: Quick, young, practical, tide-talk. Changes the subject when it gets near the Ropewalk.
vocabulary: [the tube, it's thumping, the tide, my knees, Gran, a whelk]
idioms: ["Tide's on the turn."]
sentence_habits: [Answers with the tide when she will not answer., Says "Mostly I don't read it."]
never_says: [Anything that gives Hester away before she decides to.]
tics: [Rubs the backs of her knees., Runs everywhere.]
good_lines: ["Tide's on the turn. I can feel it in the backs of my legs, like a dog wanting out.", "Tub Merrow. He brings me a whelk every Low Night, in a paper."]
the_wound:
  what_they_did: On the quay after the first dawn, with the sun on the wet stone, she read the Shelf's
    strip aloud the way she reads everything aloud, FURTHER LOSS ANTICIPATED. Sallis was on the steps
    with his cap in his hands. He asked her to read it again. She read it again, slower, because he was
    a grown man asking politely. She remembers his lips moving with hers on the second time.
  the_lie_they_live: Mostly I don't read it. It's only Gran's typing.
