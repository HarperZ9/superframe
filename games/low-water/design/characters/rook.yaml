format: lw-character/1
speaker: ROOK
name: Euphemia Rook, telegraphist
background:
  born: Hesk, a railwayman's daughter; posted to the Gullet telegraph office thirty years ago and never moved.
  trade: Sends and receives every telegram in Gullet. Remembers all of them and pretends not to.
  family: Lives alone over the office with a cat.
  schooling: The telegraph service's school at Hesk.
  money: A Post Office wage and ninepence for the first twelve words of everyone else's.
wants: [A witness for something of her own., The office left as it is.]
fears: [Section Nine of the Telegraph Act., Being asked to recall.]
hides: [She keeps every form in her own hand against the regulations., Since March she has held back one wire: GULLET LIGHT GREEN STOP SHIPS STEERING BY EYE STOP COME AND SEE.]
sees:
  town: Words that go out at ninepence and come back as headlines.
  board: Keel pays for twenty-seven words and uses twenty-six.
  lamb: Someone from away who writes things down and will sign under what she puts.
knows: [Every telegram's time and text., What the Courier prints and what it buries.]
does_not_know: [The Shelf's typist, though she has guessed., What happened on the mole.]
register: Dry, procedural, quotes the regulations and the wires in capitals. "I don't recall it" as a refusal and a joke.
vocabulary: [STOP, the wire, ninepence, the spike, the Courier, section, the form, struck]
idioms: ["I don't recall it.", "Ninepence the first twelve words, if you're sending."]
sentence_habits: [Quotes a telegram instead of an opinion., Ends a confession with "I don't recall it".]
never_says: [Speeches about honesty or the press. She says what the Courier's man printed and where.]
tics: [Taps a key on the counter with one finger when thinking., Never looks up while she quotes.]
good_lines: ["Twenty-six words. He paid for twenty-seven. I don't recall it.", "There's nothing below. There was something above."]
the_wound:
  what_they_did: In March a man from the Brine handed in GULLET LIGHT GREEN STOP SHIPS STEERING BY EYE
    STOP COME AND SEE, with ninepence. She took his money and gave him change and stamped the form. When
    he had gone she read it three times and put it on the spike, face down, under the next one. She still
    has his ninepence in a separate envelope in the drawer.
  the_lie_they_live: I'm the wire. I don't recall it. Hesk could do without a panic.
