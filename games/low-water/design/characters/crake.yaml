format: lw-character/1
speaker: CRAKE
name: Ottilie Crake, Alderman
background:
  born: Gullet, a coal merchant's daughter on the hill, above the Gut and never in it.
  trade: Chair of the Gullet Lamp Trust and the Municipal Light and Coke Company, one address and one ledger. Reads accounts the way other people read letters.
  family: Widowed young, no children. A sister in Hesk she writes to on Sundays and visits at Christmas.
  schooling: A ladies' academy at Hesk, then her father's counting house, which taught her more.
  money: Comfortable and stretched. Pays thirty-eight wages on the hill (six Lamplighters, the substation men, Mrs Pellow, clerks). Has carried the quay's coke bill for two years; the Board repays when it remembers. Seven pounds a week to Mrs Gannet in the crossword, fourteen since the rewiring. The bank at Hesk lends to the Trust because the Trust is insured.
wants:
  - The lamps on, every night, at a cost the bank will sign.
  - Her name on the new light and the automation called a success in the Hesk paper.
  - To be thanked once, by somebody who means it.
fears:
  - Colour, a little. She has a theory it distracts people and she half believes it.
  - The bank's letter that says the figure is over the line.
  - Being found out as kind, because kind people get asked for more.
hides:
  - She struck the keeper clause from Fisk's specification to bring the figure under a line.
  - She stopped Wenna's wages "pending a review" that never sat.
  - She keeps the Shelf alive with drafts in a crossword, and so pays part of Lamb's wages.
  - The letter that asked for claim 4471/G to be kept open.
sees:
  town: A place that will not pay for what it uses and blames whoever does.
  board: Keel signs what he is given and drips on it. Useful, and she has never once trusted him with a figure.
  guild: Men who switch the quay off once a year to vote by smell and send her the bill.
  congregation: Forty people who buy her lens off an old woman a prism at a time. She has not said so to anyone.
  lowco: Thieves of Trust property, and the only people who know where the Old Light's copper is.
  brine: Sabine keeps half the town on chalk. Crake respects the book-keeping and dislikes the rum.
  shelf: A dead company she keeps breathing because a live one lends to her.
  lamb: Somebody she has been paying for six years without ever seeing the face.
knows:
  - Every figure in the Trust's books, by heart.
  - That the Shelf is Mrs Gannet in a back room.
  - That Mother needs a hand at the panel after a loss of power, because she read the clause before she struck it.
does_not_know:
  - That the Guild's vote pulled the quay switch with Mother on it, until Lamb or the night tells her.
  - Anything about the Low Light in the drowned lamp.
  - Who read FURTHER LOSS ANTICIPATED aloud on the quay, until Lamb tells her.
register: Warm in a way that sounds practised. Exact numbers, said plainly. Never raises her voice; gets quieter and more precise when cornered.
vocabulary: [figure, the bank, lumens, coke, the books, quarter, wages, a review, the Municipal, standing order, kindly]
idioms:
  - "I'm sure it will be favourable."
  - "You may put that on my headstone."
  - "Mrs Pellow will see you out."
sentence_habits:
  - Answers a moral question with a cost, then waits.
  - Lists what she pays for, in order, like a ledger.
  - Corrects other people's numbers mid-sentence.
  - Uses "assessor" as a full stop.
never_says:
  - Abstract self-definitions ("I am arithmetic").
  - Balanced aphorisms, semicolon pairs.
  - Swearing, dialect words, "love".
  - The word "wicked" about herself; she would say "a bad woman", and only to dismiss it.
tics:
  - Takes off her pen's cap and puts it back.
  - Writes in yellow ink she cannot read through her own spectacles.
  - Says a figure to the penny when she is upset.
good_lines:
  - "Nobody was dismissed. A post was reviewed. The review is ongoing. I am sure it will be favourable."
  - "Mrs Pellow tells me the kettle has been at my letters again."
  - "Mind the lane. The lamps swing, and so does everything under them."
the_wound:
  what_they_did: On a Thursday afternoon in March, the window open because the coke fumes give her a headache,
    she read clause fourteen twice and drew a line through it in yellow ink. She could not see the line
    through her spectacles. She ran her fingertip along it afterwards to feel whether the nib had cut
    the paper. It had. Six years before that she had dictated one sentence to Mrs Pellow about Mrs Tallow's
    wages, pending a review, while eating a boiled egg, and she remembers the egg.
  the_lie_they_live: Nobody was dismissed. A post was reviewed. I mean everything kindly.
