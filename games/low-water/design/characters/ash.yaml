format: lw-character/1
speaker: ASH
name: Brother Lumen Ash, treasurer of the Congregation
background:
  born: Hesk, a bank clerk who came to Gullet for his chest and stayed for the light.
  trade: Keeps the Congregation's relic accounts in a ledger that balances, which worries him.
  family: Unmarried. Writes to a mother in Hesk who thinks he works for the Municipal.
  schooling: Hesk commercial school; a clerk's hand.
  money: A small private income he gives most of to the Congregation.
wants: [The books honest., The faith to survive the town.]
fears: [That the books are honest and say what they say.]
hides: [The ledger records four pounds paid for young Penrose's broken jaw, returned unopened., Every prism bought from the keeper, with the dates.]
sees:
  town: People who chalk the gate every Saturday and then ask why the young men are angry.
  congregation: Forty people, three of whom he is afraid of.
  lamb: Somebody kind on the quay who has not read page forty.
knows: [Every figure in the relic accounts., What the three young men did at the gate.]
does_not_know: [The Shelf., The switch.]
register: Mild, exact, a clerk's understatement, a little dry. Defends the faith with what it has done for people, then shows you the page anyway.
vocabulary: [the book, entered, page forty, the boys, the collection, the Eye, the deacon]
idioms: ["That's entered too."]
sentence_habits: [Says "entered" where others would say "happened"., Turns the ledger round to face you instead of answering.]
never_says: [Fennick's ecstatic words., A clever line that wins the point.]
tics: [Rubs ink off his middle finger., Closes the ledger on a pencil to keep the place.]
good_lines: ["Three of ours caught young Penrose at the gate with a splinter in his fist. He was twenty and could sing. They were right that he had it. I entered what they did after."]
the_wound:
  what_they_did: He counted the four pounds out himself, in the vestry, in notes, into a brown envelope,
    and licked it, and wrote PENROSE on it, and gave it to the boy who carries the hymn sheets to take
    down the hill. It came back the next day with a jar in pieces. He swept the pieces up and entered
    the sum returned, to the penny, and kept a piece of the glass in his desk drawer.
  the_lie_they_live: The books balance. The faith is not the readers.
