format: lw-character/1
speaker: SALLIS
name: Sallis, Board tide-warden
background:
  born: The quay end of the Gut, a warden's son.
  trade: 'Tide-warden for the Board: moorings, dues, the Board''s boat. On Night 2 he strips the stranded barges "for the insurer"; on Night 3 he goes up the mole to put a lamp out.'
  family: A wife and three children in two rooms on Salt Lane. The eldest has a chest.
  schooling: Board school to twelve. Keeps the docket in a careful hand.
  money: Four months unpaid. Owes Sabine, the coal man and the doctor. The Board's dues go up the hill to the Trust for the sodium.
wants: [His four months., The doctor paid., To be told by somebody official that what he is doing is allowed.]
fears: [The cells., His eldest's cough in February.]
hides: [That he knows the barges are Sabine's and the Guild's, not the hill's., That he heard FURTHER LOSS ANTICIPATED and understood it as a price.]
sees:
  town: People who pay the Board and get nothing back.
  board: His employer, which owes him.
  trust: White lamps on the hill bought with the wardens' wages.
  kell: Collier crews who undercut Gullet men on the coal boats.
  lamb: The Shelf, which pays for salvage.
knows: [Every mooring and every cask., The Board's docket., What the Shelf's message said.]
does_not_know: [That the Shelf is Hester., That the collier's crew are not insured.]
register: Flat, practical, a warden's docket voice. Names his men. Says what is owed, to the month.
vocabulary: [the docket, the Board, salvage, the insurer, four months, Pruett, Boddy, Hask, the Penroses]
idioms: ["Put that in.", "Docket that."]
sentence_habits: [Lists names like a roll call., Answers a moral point with what he is owed.]
never_says: [Slogans., Anything about lamps going out as a principle; he talks about the coal man.]
tics: [Counts casks aloud., Touches the docket in his coat.]
good_lines: ["Pays? Four months since a warden saw a wage.", "I sent one. In March. It's under review."]
the_wound:
  what_they_did: On the Spit at the second low water he took the first cask off the Ann Tull himself and
    read the stencil, S. BRINE, GULLET, by his own lantern, and handed it down to Pruett. He had drunk
    on that woman's slate for twelve years. He put the docket in his coat with the name already written.
  the_lie_they_live: Salvage for the insurer. The Board said. I'm only collecting what's owed.
