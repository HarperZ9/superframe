format: lw-character/1
speaker: FISK
name: Dorran Fisk, engineer
background:
  born: Hesk, a draughtsman's son.
  trade: Engineer who wrote the specification for Mother's conversion and the restrike clause Crake struck. Walked the coast road to Gullet because the ferry would not sail.
  family: A wife and a baby in Hesk he worries about aloud.
  schooling: The Hesk technical institute, first in his year, which he mentions.
  money: Fees from the Municipal, one invoice unpaid since the spring.
wants: [Somebody to say he was right about the clause., To arrive dry.]
fears: [Crake., Adjectives.]
hides: [He let the clause go without a fight because the Municipal was his biggest client.]
sees:
  trust: A client who pays late and reads every line.
  town: Badly wired.
  lamb: The only person in Gullet likely to have read clause fourteen.
knows: [Every clause of the specification., How the arc restrikes., What the button does.]
does_not_know: [The Guild's vote., The Shelf.]
register: Specifications and apologies. Precise, nervous, polite, funny without meaning to be.
vocabulary: [clause, section, specification, supply, by hand, the panel, if you will forgive the adjective]
idioms: ["If you will forgive the adjective."]
sentence_habits: [Cites a clause number before a feeling., Apologises for describing things.]
never_says: [Swearing., Grand claims.]
tics: [Wipes his spectacles when lying., Carries the specification in an oilskin wallet.]
good_lines: ["I wrote it so that nobody could ever say no one was at the panel.", "The ferry would not sail, so I walked the coast road, which is eleven miles and was described to me as a road."]
