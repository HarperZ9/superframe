format: lw-character/1
speaker: KEEL
name: Absalom Keel, harbourmaster
background:
  born: Hesk, a customs officer's son. Came to Gullet as a young clerk to the Board and stayed.
  trade: Harbourmaster for nineteen years. Signs everything the Board does, and since the fall eleven years ago has been wet without stopping.
  family: A wife in Hesk who will not live in Gullet; they write. No children.
  schooling: Grammar school at Hesk; the Board's own examinations.
  money: A Board salary paid late since the dues went up the hill. Owes Sabine more than he admits. Wants the Shelf to pay for a new lens so nobody counts the green rings.
wants: [A new lens, paid by the Shelf., His signature never read aloud.]
fears: [The works order he signed being found., The rope, which he talks about to frighten others and lies awake over.]
hides: [He signed the rewiring onto the quay board., He knew the Guild's vote would pull the switch., He filed the claim at 18:30, three hours early, blaming wreckers.]
sees:
  town: A harbour that would be a beach without the Board's forms.
  trust: The Alderman's money; he resents and obeys it.
  lowco: Merrow, a convenient word.
  shelf: The one authority he fears, without knowing why it never visits.
  lamb: A cheque in a coat.
knows: [The vote pulls the quay switch at 21:38., Mother is on the quay board., He filed early.]
does_not_know: [Why he is wet. Nobody does., That the Shelf is Hester.]
register: The Board's voice. Speaks of himself as "the Board" (profiles.json enforces it). Long official sentences that drip at the commas.
vocabulary: [the Board, gratified, the Shelf, persons, the Light, malicious, coincidence, tides, obliged]
idioms: ["The Board is gratified.", "The Board would be obliged."]
sentence_habits: [Passive voice when he is guilty., Gives a fact and calls it a fact about the calendar.]
never_says: ['"I", "me" or "my" (profiles.json).', Slang., A plain apology.]
tics: [Water from his cuffs., Stands where he stood before; the puddle is already there.]
good_lines: ["The Board has done nothing, which is, assessor, the Board's whole art.", "Do not stand there. That is where the Board stands. You will find it is already wet."]
the_wound:
  what_they_did: Seven months ago, in the harbour office with the rain on the window, he signed the works
    order that put Mother on the quay board. The pen was the only dry thing on the desk. He blotted the
    signature with his own cuff and it ran, and he signed it again under the blot. On Low Night at twenty-five
    past six he walked the claim to the telegraph office himself and stood at the counter while Miss Rook
    struck the time, and he watched her strike it, and he said thank you. Then he went and stood on the
    quay in the dark and waited for what he had paid for.
  the_lie_they_live: The Board did it. The Board, not Absalom Keel. A man can be wet; a Board cannot be
    guilty.
