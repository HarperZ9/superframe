format: lw-character/1
speaker: PENHALLOW
name: Ysolde Penhallow, master of the Saint Cuthwin
background:
  born: A Gullet pilot's daughter; went to sea at fifteen and has commanded the ferry for twenty years.
  trade: Master of the Saint Cuthwin, Hesk to Gullet twice a night. Will not sail until Mother burns true.
  family: Unmarried. Her crew, six of whom are Kellish firemen she hired because they do not drink at sea.
  schooling: The navigation school at Hesk.
  money: The ferry company pays her; every night she does not sail costs her owners and her crew.
wants: [Mother burning true., Her passengers off her conscience.]
fears: [A light on the wrong bearing.]
hides: [The ship's clock is four minutes fast and she knows it.]
sees:
  town: A harbour she would not enter without Mother.
  board: Signatures that do not steer ships.
  kell: Her firemen. She would back them against any Gullet man in a stokehold.
  lamb: Passenger with the case.
knows: [The bearing, the time, the Spit by a cable., Her crew.]
does_not_know: [The switch, the clause, the Shelf.]
register: Bearings and log entries, never proverbs. Short, exact, a captain's dryness.
vocabulary: [bearing, cable, starboard, the flash, log, helm, steam, my firemen]
idioms: ["Enter that."]
sentence_habits: [Speaks as a log entry with the time first., States position, then judgement.]
never_says: ['Sea proverbs (EDITOR-NOTES S7).', '"Ships are fussy" lines; that is Wenna''s.']
tics: [Checks her watch against the wheelhouse clock., Writes in the log in the Brine.]
good_lines: ["You held the rail like a man holding a pen.", "Log, Low Night. Six firemen out of Kell kept steam in her from the Spit to the berth."]
