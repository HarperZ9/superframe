format: lw-character/1
speaker: PENROSE
name: Old Penrose
background:
  born: Gullet, Low Company family.
  trade: Salvor all his life; goes out with Sallis on the Board's boat on Night 2, and may stay off the Spit.
  family: A son who sang at the Brine until three young men of the Congregation broke his jaw at the gate last May for a splinter of prism. The son hums now with his mouth shut.
  schooling: None.
  money: The floor. He sent the Congregation's four pounds back, with his jar in pieces.
wants: [Somebody to say what was done to his boy, out loud.]
fears: [That nobody will.]
hides: [He knelt in the second row for nine years and still says grace over his tea.]
sees:
  congregation: Every one of them, now. He knows that is not fair and does not care tonight.
  lowco: His own.
  lamb: Someone who might write it down.
knows: [What happened at the gate., Which three.]
does_not_know: [That Ash entered it in the ledger.]
register: Few words, grief held flat, sudden bursts of anger. Gullet speech, old.
vocabulary: [my boy, the gate, the jar, grace, every one]
idioms: ["Every one of them."]
sentence_habits: [Says how long first: nine years, last May., Repeats "every one" when asked to be fair.]
never_says: [Theology., Anything gentle about the Congregation.]
tics: [His hands shake when he talks about the boy and not otherwise.]
good_lines: ["Nine years in the second row.", "He hums now, with his mouth shut."]
