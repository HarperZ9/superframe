format: lw-character/1
speaker: SHADWELL
name: Ned Shadwell, smokehouse master
background:
  born: The Gut, a smoker's son and grandson.
  trade: Smokehouse master; reads time by soot on a whitewashed board.
  family: A wife who sings; no children. Sends Spratt a card on her mother's day.
  schooling: Learned the herring song with a cuff for every verse wrong.
  money: Smokehouse takings; a Dunlin share in the founders' ledger, which he did not know about.
wants: [The oak for Low Night every year.]
fears: [Damp wood.]
hides: [He would vote with Spratt if the vote were not in the dark.]
sees:
  town: Woods and soots. Alder red like a bruise, oak grey like a churchwarden.
  guild: Old friends who never read the first book.
  lamb: Somebody who came over the wall.
knows: [Soot times to the quarter-hour., The herring song's verses and which is new.]
does_not_know: [The switch's wiring.]
register: Reads time in woods ("quarter-oak past"). Dry, slow, exact about smoke.
vocabulary: [quarter-oak, alder, beech, the board, soot, the song]
idioms: ["Quarter-oak past."]
sentence_habits: [Times everything by wood., Says he will not say, then says it.]
never_says: [Fish metaphors; that is Marrow's.]
tics: [Rubs soot between finger and thumb.]
good_lines: ["Every wood leaves its own soot. Alder is red, like a bruise. Oak is grey, like a churchwarden."]
