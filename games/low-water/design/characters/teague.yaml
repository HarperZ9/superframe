format: lw-character/1
speaker: TEAGUE
name: Orrin Teague
background:
  born: Hesk, a clerk's son; came to Gullet nine years ago on business he no longer mentions.
  trade: Was a shipping clerk. Now he waits for the morning boat, every morning, at the table by the door.
  family: A sister, Mrs Ellen Pawley, by the station at Hesk, who sends postal orders that pay his slate.
  schooling: Hesk grammar school; writes a fine hand, which shakes before the first drink.
  money: His sister's postal orders. Nine years of rum on Sabine's slate.
wants: [To be fit to stand on a deck at seven in the morning., To bring his letter to his sister himself, so it will be true when it arrives.]
fears: [The first hour of the morning., Being spoken to kindly about it.]
hides: [How much he drinks; everyone knows and nobody says., That he once got as far as the mole steps.]
sees:
  town: A room he can see the door of.
  brine: Kind, and the kindness is how nine years go; he knows that and stays.
  lamb: A man counting, like him.
knows: [The Brine's clock is eleven minutes slow., Merrow said he'd see her blind, after four rums, four weeks ago, and what he meant by it., The song about the Kell.]
does_not_know: [Anything that happened outside the Brine.]
register: Formal, precise, self-mocking. A clerk's grammar held together by effort. Funny about himself and never about anyone else.
vocabulary: [the morning boat, the belt, the first one, the hour, method, the hand, my sister]
idioms: ["It has not yet suited.", "I count. There is nothing else to do between boats."]
sentence_habits: [States a plan, then the small reason it failed., Never says the word drink about himself.]
never_says: [Advice. He says he has none., The word "addiction" or any other clinic word.]
tics: [Checks the strap on his luggage., Keeps his right hand under the table.]
good_lines: ["I have been off on the morning boat for nine years. It has not yet suited.", "Every night at closing I stop. I've stopped four thousand times; I'm very good at it. It's the mornings that don't hold."]
the_wound:
  what_they_did: Four years ago, in March, he got as far as the mole steps with the luggage strapped and
    the belt done up. The ferry was in. The mate had the gangway down and was looking at him. Teague's
    right hand was going so badly he couldn't hold the ticket still to show it. He turned round and walked
    back up the quay to the Brine for the first one, to steady the hand, and when he came out again the
    gangway was up. He has not been back to the steps since.
  the_lie_they_live: Tomorrow. When I go, I shall go properly. One movement.
