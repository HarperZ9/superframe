format: lw-character/1
speaker: FENNICK
name: Ambrose Fennick, deacon of the Congregation of the Filament
background:
  born: Gullet, an electrician's mate's son, and an electrician's mate himself until twelve years ago.
  trade: Carried Mother's old lamp down the stairs at the conversion; the filament broke and he says the light came into him. Founded the Congregation within the year. Forty members and a gasholder.
  family: Unmarried. His mother is in the second row on Saturdays and does not believe a word.
  schooling: Board school; the Municipal's wiring course, which he still quotes.
  money: The collection, the relic accounts Ash keeps, coin paid to Wenna for prisms.
wants: [More splinters of the Eye., The Old Bulb honoured and one day relit.]
fears: [The splinters called stolen and the faith called theft., Being an electrician's mate again.]
hides: [He buys the prisms from Wenna and knows the replacements are bottle glass.]
sees:
  town: People who laugh at the jars and have never once been quiet.
  board: A wet man who owes the light an apology.
  congregation: His children, a little more than they would like.
  lamb: A pilgrim who has not yet seen.
knows: [Every prism by its number., The wiring of the old lamp., What the rule about lifting jars does to Sister Gauze's brother.]
does_not_know: [The Shelf., The switch.]
register: Soft, ecstatic, technical. The language of wiring and prayer mixed.
vocabulary: [the Eye, splinters, the Old Bulb, filament, opened, grace, schedule, circuit, numbered]
idioms: ["We do not say it broke. We say it was opened.", "The Lord is an engineer."]
sentence_habits: [Lists the faith's virtues and cannot stop before the last one, which is pride., Answers a charge with a hymn line.]
never_says: [Neat definitions ("A rule is a jar for..."). He argues from what would happen to his forty people., Profanity.]
tics: [Carries a bell jar under his arm like a hat., Dabs his forehead in the dark.]
good_lines: ["Every prism of the Eye is numbered. The Lord is an engineer, assessor. He leaves a schedule.", "Low light, low water, low voices."]
the_wound:
  what_they_did: In the vestry, the winter after the conversion, with the door bolted, he held a real
    prism and one of Sabine's green ones up to the same candle and turned them. The real one threw a ring
    of white on the wall. The green one threw a smudge. He sat with them for an hour. Then he put the
    green one in the reliquary on the velvet, wrote SPLINTER 114 on the card in his best hand, and took
    the real one home in his pocket, where it still is, because he can't sell it and can't give it back.
  the_lie_they_live: We do not say it broke. We say it was opened. The light chose me.
