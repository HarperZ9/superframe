format: lw-character/1
speaker: WENNA
name: Wenna Tallow, keeper of Mother
background:
  born: Gullet, a lamp-trimmer's daughter, two doors from Sabine.
  trade: Keeper of Mother for thirty-one years, the last six unpaid. Paraffin burns on both hands from the old lamp. Has not climbed the 112 stairs at night for three years.
  family: Never married. A brother lost off the Spit when she was nineteen, which is why she took the lamp.
  schooling: Dame school; learned the lens from the old keeper, by heart, ring by ring.
  money: None coming in. Sells Mother's prisms to Fennick for coin, puts Sabine's green bottle glass in their place. Lives on the slate.
wants: [To keep Mother, and be let alone with her., Her wages, though she would never ask twice.]
fears: [That Mother will be found out and she will be the one who did it., Her knees on the stairs.]
hides: [The prisms sold and the green glass put in., She heard Mother's motor stop at 21:40 and stayed by the stove., She has not climbed at night for three years.]
sees:
  town: People who look up at Mother and never once up the stairs.
  trust: A telegram that said UNDER REVIEW STOP.
  congregation: Fennick pays fair and asks nothing; she despises him a little for not asking.
  brine: Sabine's stove, Sabine's slate, Sabine.
  lamb: Somebody from away who will either learn the difference or go home on the morning boat.
knows: [Every ring of the lens, every prism by its number., What Mother's motor sounds like stopping.]
does_not_know: [That the rewiring put Mother on the quay board, in detail; she knows only that Mother comes on with the quay now., The Shelf is Hester.]
register: Short sentences. Calls Mother "she" and "her". Answers questions about herself with facts about the lamp.
vocabulary: [she, her, the stairs, the rings, the panel, the stove, glass, ships]
idioms: ["She's got her eye shut.", "Ships are fussy."]
sentence_habits: [Turns any question about herself into one about the lamp., Stops talking and looks at the lamp instead of finishing.]
never_says: [Anything about her own feelings directly., Long sentences., Abstract nouns about duty or loyalty.]
tics: [Counts stairs under her breath., Rubs the burns on her hands.]
good_lines: ["She's not dark. She's got her eye shut.", "You don't go up a hundred and twelve stairs to be not needed.", "You've got it right. That's worse."]
the_wound:
  what_they_did: Six years ago, the Tuesday after the telegram came back UNDER REVIEW STOP, she sat on
    the top step of the lamp room with a butter knife and worked the first prism out of its brass. Number
    one hundred and fourteen, lower catadioptric ring. It came away with a sound like a tooth. She wrapped
    it in her stocking and walked it down a hundred and twelve stairs with one shoe off, because she couldn't
    get the stocking back on over the burn on her heel. On Low Night she heard the motor stop at twenty
    to ten, in the Brine, by the stove, with her hand on the rail. She felt it in the rail. She kept her
    hand there until the rail went cold, and then she ordered a tea.
  the_lie_they_live: She's got her eye shut. She doesn't know the difference. Ships might.
